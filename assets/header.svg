<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jinsui Chen — Software Engineer</title>
  <desc id="desc">Blue and violet geometric waves surrounding a personal introduction.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d43"/><stop offset=".55" stop-color="#253b80"/><stop offset="1" stop-color="#6549ab"/></linearGradient>
    <linearGradient id="wave"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1100" cy="10" r="230" fill="#a78bfa" opacity=".09"/>
    <circle cx="1100" cy="10" r="175" fill="none" stroke="#c4b5fd" stroke-opacity=".18"/>
    <path d="M700 290C815 95 930 390 1230 130M700 255C840 60 960 355 1230 95M700 220C865 25 990 320 1230 60" fill="none" stroke="url(#wave)" stroke-width="2" opacity=".55"/>
    <path d="m998 106 22-13 22 13v26l-22 13-22-13z" fill="none" stroke="#c4b5fd" stroke-opacity=".7" stroke-width="2"/>
    <circle cx="885" cy="223" r="5" fill="#93c5fd"/>
    <circle cx="1110" cy="203" r="3" fill="#ddd6fe"/>
    <rect x="68" y="62" width="32" height="4" rx="2" fill="#93c5fd"/>
    <text x="68" y="128" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-1">Jinsui Chen</text>
    <text x="70" y="170" fill="#c7d7ff" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3">SOFTWARE ENGINEER</text>
    <text x="70" y="232" fill="#e0e7ff" font-family="Arial, Helvetica, sans-serif" font-size="18">Stay curious. Build with purpose. Share what you learn.</text>
  </g>
</svg>
