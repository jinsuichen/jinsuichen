<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Jinsui Chen — Software Engineer</title>
  <desc id="description">Software Engineering at Northeastern University, China. ACM / ICPC Gold Medalist. Currently at Douyin China E-commerce. Previously worked on real-time data platforms at Alipay. Tech: TypeScript, Python, Go, Apache Flink. Contact: ischenjinsui@gmail.com.</desc>
  <defs>
