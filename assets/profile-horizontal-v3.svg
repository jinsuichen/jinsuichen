    <linearGradient id="line"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="388" rx="20"/></clipPath>
    <clipPath id="left"><rect width="350" height="390"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1200" height="390" fill="#111827"/>
    <rect width="350" height="390" fill="url(#hero)"/>
    <rect width="350" height="390" fill="url(#grid)"/>
    <g clip-path="url(#left)">
      <circle cx="330" cy="350" r="150" fill="#c4b5fd" opacity=".06"/>
      <path d="M-40 310C70 150 175 440 390 230M-40 340C70 180 175 470 390 260M-40 370C70 210 175 500 390 290" fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".35"/>
    </g>
    <text x="36" y="77" fill="#c7d7ff" font-size="18">Hi, I'm</text>
    <text x="33" y="131" fill="#fff" font-size="42" font-weight="700" letter-spacing="-1">Jinsui Chen</text>
    <text x="36" y="169" fill="#dbeafe" font-size="15" letter-spacing="2">SOFTWARE ENGINEER</text>
    <rect x="36" y="195" width="34" height="3" rx="1.5" fill="#93c5fd"/>
    <text x="36" y="350" fill="#c7d7ff" font-size="15">@jinsuichen</text>

    <text x="388" y="42" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="2.5">ABOUT</text>
    <g font-size="18">
      <text x="388" y="76" fill="#f3f4f6"><tspan font-weight="600">Northeastern University, China</tspan><tspan fill="#b8c4d8"> · Software Engineering</tspan></text>
      <text x="388" y="138" fill="#f3f4f6" font-weight="600">ACM / ICPC Gold Medalist</text>
      <text x="388" y="174" fill="#f3f4f6"><tspan font-weight="600">Douyin China E-commerce</tspan><tspan fill="#b8c4d8"> · Current</tspan></text>
      <text x="388" y="210" fill="#f3f4f6"><tspan font-weight="600">Alipay</tspan><tspan fill="#b8c4d8"> · Previously worked on real-time data platforms</tspan></text>
    </g>
    <path d="M388 231H1162" stroke="#293449"/>
    <text x="388" y="258" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="2.5">TECH</text>
    <g transform="translate(388 273)" font-size="14" font-weight="600" text-anchor="middle" fill="#bfdbfe">
      <rect width="112" height="31" rx="7" fill="#1e3a5f"/><text x="56" y="21">TypeScript</text>
      <rect x="122" width="88" height="31" rx="7" fill="#1e3a5f"/><text x="166" y="21">Python</text>
      <rect x="220" width="64" height="31" rx="7" fill="#1e3a5f"/><text x="252" y="21">Go</text>
